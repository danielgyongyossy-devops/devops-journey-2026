name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  id-token: write
  contents: read

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GKE_CLUSTER: my-cluster  
  GKE_ZONE: us-central1-a  
  IMAGE: gcr.io/${{ secrets.GCP_PROJECT_ID }}/cloud-native-app

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd .github/workflows/cloud-native-app/App
          pip install -r requirements.txt

      - name: Run tests
        run: |
          cd .github/workflows/cloud-native-app/App
          pytest

  build-and-push:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Check WIF secrets are set
        run: |
          if [ -z "${{ secrets.GCP_WIF_PROVIDER }}" ]; then
            echo "GCP_WIF_PROVIDER is empty/missing"
            exit 1
          fi

          if [ -z "${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}" ]; then
            echo "GCP_WIF_SERVICE_ACCOUNT is empty/missing"
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify auth
        run: |
          gcloud auth list
          gcloud auth print-access-token | head -c 20

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker --quiet

      - name: Build and push Docker image
        run: |
          cd .github/workflows/cloud-native-app/App

          docker build -t "$IMAGE:$GITHUB_SHA" .
          docker tag "$IMAGE:$GITHUB_SHA" "$IMAGE:latest"

          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: gke-gcloud-auth-plugin

      - name: Get GKE credentials
        run: |
          gcloud container clusters get-credentials \
          $GKE_CLUSTER \
          --zone $GKE_ZONE \
          --project $PROJECT_ID

      - name: Update kustomize image tag
        run: |
          sed -i "s/newTag: latest/newTag: $GITHUB_SHA/" \
          .github/workflows/cloud-native-app/App/Kubernetes/Gcp/kustomization.yaml

      - name: Deploy to GKE
        run: |
          kubectl apply -k \
          .github/workflows/cloud-native-app/App/Kubernetes/Gcp
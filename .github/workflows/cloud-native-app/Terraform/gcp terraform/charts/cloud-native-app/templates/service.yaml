apiVersion: v1
kind: Service
metadata:
  name: {{ include "cloud-native-app.fullname" . }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port | default 80 }}
      targetPort: {{ .Values.service.targetPort | default 8000 }}
      protocol: TCP
      name: http
  selector:
    {{- include "cloud-native-app.selectorLabels" . | nindent 4 }}
